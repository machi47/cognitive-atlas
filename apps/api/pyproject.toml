[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-atlas-api"
version = "0.1.0"
description = "Local-first conversation-centered learning kernel API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.2.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

